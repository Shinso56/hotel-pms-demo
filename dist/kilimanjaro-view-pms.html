/* ==========================================================================
   ui.js — presentation helpers: formatting, icons, pills, toasts, modals,
   and small hand-rolled SVG charts. No charting library.
   ========================================================================== */

var UI = (function () {
  "use strict";

  /* ------------------------------------------------------------ escaping */

  /* Everything that reaches innerHTML goes through this. Guest names are
     free text, so treating them as trusted would be an injection hole. */
  function esc(v) {
    if (v === null || v === undefined) return "";
    return String(v)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  /* ------------------------------------------------------------ formatting */

  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  function money(n) {
    var v = Math.round(Number(n) || 0);
    return "TZS " + v.toLocaleString("en-US");
  }
  function moneyShort(n) {
    var v = Math.round(Number(n) || 0);
    if (v >= 1000000) return "TZS " + (v / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
    if (v >= 1000) return "TZS " + Math.round(v / 1000) + "k";
    return "TZS " + v;
  }
  function dateLong(isoStr) {
    if (!isoStr) return "—";
    var d = Store.parseISO(String(isoStr).slice(0, 10));
    return DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
  }
  function dateShort(isoStr) {
    if (!isoStr) return "—";
    var d = Store.parseISO(String(isoStr).slice(0, 10));
    return d.getDate() + " " + MONTHS[d.getMonth()];
  }
  function dateTime(tsStr) {
    if (!tsStr) return "—";
    var datePart = String(tsStr).slice(0, 10);
    var timePart = String(tsStr).slice(11, 16);
    return dateShort(datePart) + (timePart ? ", " + timePart : "");
  }
  function timeOnly(tsStr) {
    return String(tsStr || "").slice(11, 16) || "—";
  }
  function relativeDay(isoStr) {
    if (!isoStr) return "—";
    var diff = Math.round((Store.parseISO(isoStr) - Store.parseISO(Store.today())) / 86400000);
    if (diff === 0) return "Today";
    if (diff === 1) return "Tomorrow";
    if (diff === -1) return "Yesterday";
    if (diff > 0) return "In " + diff + " days";
    return Math.abs(diff) + " days ago";
  }
  function initials(name) {
    var parts = String(name || "").trim().split(/\s+/);
    if (!parts[0]) return "?";
    return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
  }

  /* ------------------------------------------------------------ icons */

  var ICONS = {
    dashboard: '<path d="M3 3h7v7H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 14h7v7H3z"/>',
    rooms: '<path d="M3 21h18M5 21V6l7-3 7 3v15M10 10h.01M14 10h.01M10 14h.01M14 14h.01"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    guests: '<path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20"/><circle cx="9" cy="7" r="3.5"/><path d="M22 20v-1.5a4 4 0 0 0-3-3.85M16.5 3.6a4 4 0 0 1 0 6.8"/>',
    key: '<circle cx="7.5" cy="15.5" r="4"/><path d="m10.5 12.5 8-8 3 3-2 2-2-2-1.5 1.5 2 2-2.5 2.5"/>',
    broom: '<path d="M12 3v9M8 12h8l1.5 9h-11z"/><path d="M10 16v5M14 16v5"/>',
    chart: '<path d="M3 3v18h18"/><path d="M7 15l3.5-4 3 3L21 6"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    close: '<path d="M18 6 6 18M6 6l12 12"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    checkCircle: '<circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
    alert: '<path d="M12 3 2 20h20L12 3z"/><path d="M12 9v5M12 17h.01"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
    login: '<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/>',
    logout: '<path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>',
    bed: '<path d="M2 18v-7h14a4 4 0 0 1 4 4v3M2 11V6M2 18h20"/><circle cx="7" cy="9" r="2"/>',
    money: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
    trend: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
    door: '<path d="M4 21V4a1 1 0 0 1 1-1h11a1 1 0 0 1 1 1v17M3 21h18"/><circle cx="13.5" cy="12" r="1"/>',
    refresh: '<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13M9 7V4h6v3"/>',
    menu: '<path d="M3 6h18M3 12h18M3 18h18"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>',
    empty: '<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M8 15h8"/>',
    wrench: '<path d="M14.7 6.3a4 4 0 0 0 5 5l-9 9a2.8 2.8 0 0 1-4-4z"/>',
    shield: '<path d="M12 3l8 3v6c0 5-3.5 8.2-8 9-4.5-.8-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
  };

  function icon(name, cls) {
    var path = ICONS[name] || ICONS.info;
    return '<svg viewBox="0 0 24 24"' + (cls ? ' class="' + cls + '"' : "") + ' aria-hidden="true">' + path + "</svg>";
  }

  /* ------------------------------------------------------------ pills */

  var RES_STATUS = {
    "confirmed":   { cls: "pill-primary", label: "Confirmed" },
    "in-house":    { cls: "pill-info",    label: "In house" },
    "checked-out": { cls: "pill-neutral", label: "Checked out" },
    "cancelled":   { cls: "pill-neutral", label: "Cancelled" },
    "no-show":     { cls: "pill-danger",  label: "No show" }
  };
  var ROOM_STATUS = {
    "available":   { cls: "pill-ok",     label: "Available" },
    "occupied":    { cls: "pill-info",   label: "Occupied" },
    "dirty":       { cls: "pill-warn",   label: "Needs cleaning" },
    "maintenance": { cls: "pill-danger", label: "Out of order" }
  };
  var CARD_STATUS = {
    "active":  { cls: "pill-ok",      label: "Active" },
    "expired": { cls: "pill-neutral", label: "Expired" },
    "revoked": { cls: "pill-danger",  label: "Revoked" }
  };

  function pill(map, key) {
    var m = map[key] || { cls: "pill-neutral", label: key || "—" };
    return '<span class="pill ' + m.cls + '">' + esc(m.label) + "</span>";
  }
  function resPill(s) { return pill(RES_STATUS, s); }
  function roomPill(s) { return pill(ROOM_STATUS, s); }
  function cardPill(s) { return pill(CARD_STATUS, s); }

  function person(name, sub) {
    return '<div class="person">' +
      '<span class="av">' + esc(initials(name)) + "</span>" +
      '<span class="nm"><b>' + esc(name) + "</b>" +
      (sub ? "<span>" + esc(sub) + "</span>" : "") + "</span></div>";
  }

  /* ------------------------------------------------------------ toasts */

  function toast(kind, title, message) {
    var root = document.getElementById("toasts");
    if (!root) return;
    var iconName = kind === "ok" ? "checkCircle" : kind === "err" ? "alert" : kind === "warn" ? "alert" : "info";
    var el = document.createElement("div");
    el.className = "toast " + kind;
    el.innerHTML = icon(iconName) +
      "<div><b>" + esc(title) + "</b>" + (message ? "<span>" + esc(message) + "</span>" : "") + "</div>";
    root.appendChild(el);
    setTimeout(function () {
      el.classList.add("out");
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 220);
    }, 3600);
  }

  /* ------------------------------------------------------------ modal */

  var modalRoot = null;
  var lastFocus = null;
  var onConfirm = null;

  function ensureRoot() {
    if (!modalRoot) modalRoot = document.getElementById("modalRoot");
    return modalRoot;
  }

  function openModal(opts) {
    var root = ensureRoot();
    if (!root) return;
    lastFocus = document.activeElement;
    onConfirm = opts.onConfirm || null;

    var footer = "";
    if (opts.actions !== false) {
      footer = '<div class="modal-foot">' +
        '<button class="btn btn-ghost" data-modal-close>' + esc(opts.cancelText || "Cancel") + "</button>" +
        (opts.confirmText
          ? '<button class="btn ' + (opts.confirmKind || "btn-primary") + '" data-modal-confirm>' +
            esc(opts.confirmText) + "</button>"
          : "") +
        "</div>";
    }

    root.innerHTML =
      '<div class="modal-bg" data-modal-close></div>' +
      '<div class="modal-card' + (opts.wide ? " wide" : "") + '" role="dialog" aria-modal="true" aria-label="' + esc(opts.title) + '">' +
        '<div class="modal-head">' +
          "<div><h2>" + esc(opts.title) + "</h2>" +
          (opts.subtitle ? "<p>" + esc(opts.subtitle) + "</p>" : "") + "</div>" +
          '<button class="icon-btn" data-modal-close aria-label="Close">' + icon("close") + "</button>" +
        "</div>" +
        '<div class="modal-body">' + (opts.body || "") + "</div>" +
        footer +
      "</div>";

    root.classList.add("open");
    document.body.style.overflow = "hidden";

    var focusTarget = root.querySelector("[data-autofocus]") || root.querySelector("input,select,textarea,button");
    if (focusTarget) focusTarget.focus();
  }

  function closeModal() {
    var root = ensureRoot();
    if (!root) return;
    root.classList.remove("open");
    root.innerHTML = "";
    document.body.style.overflow = "";
    onConfirm = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
    lastFocus = null;
  }

  function confirmModal() {
    if (typeof onConfirm === "function") onConfirm();
  }

  /* ------------------------------------------------------------ charts */

  /* Vertical bars. `data` is [{label, value, sub}]. */
  function barChart(data, opts) {
    opts = opts || {};
    var max = Math.max.apply(null, data.map(function (d) { return d.value; }).concat([1]));
    var html = '<div class="chart-wrap"><div class="bars">';
    data.forEach(function (d) {
      var pct = Math.round((d.value / max) * 100);
      var title = d.label + ": " + (opts.format ? opts.format(d.value) : d.value);
      html += '<div class="bar-col">' +
        '<div class="bar-track">' +
          '<div class="bar' + (d.alt ? " alt" : "") + '" style="height:' + pct + '%" title="' + esc(title) + '"></div>' +
        "</div>" +
        '<span class="bar-lbl">' + esc(d.label) + "</span>" +
      "</div>";
    });
    html += "</div></div>";
    return html;
  }

  /* Horizontal stacked bar with a legend beneath. */
  function splitBar(rows) {
    var total = rows.reduce(function (s, r) { return s + r.value; }, 0) || 1;
    var bar = '<div class="split-bar">';
    rows.forEach(function (r) {
      var pct = (r.value / total) * 100;
      if (pct <= 0) return;
      bar += '<i style="width:' + pct.toFixed(2) + "%;background:" + r.color + '" title="' + esc(r.label) + '"></i>';
    });
    bar += "</div>";

    var legend = '<div class="split-legend">';
    rows.forEach(function (r) {
      legend += "<div><i style=\"background:" + r.color + '"></i><span>' + esc(r.label) + "</span>" +
        '<span class="v">' + esc(r.display !== undefined ? r.display : r.value) + "</span></div>";
    });
    legend += "</div>";
    return bar + legend;
  }

  function empty(title, message) {
    return '<div class="empty">' + icon("empty") + "<b>" + esc(title) + "</b>" +
      (message ? "<p>" + esc(message) + "</p>" : "") + "</div>";
  }

  /* ------------------------------------------------------------ exports */
  return {
    esc: esc,
    money: money, moneyShort: moneyShort,
    dateLong: dateLong, dateShort: dateShort, dateTime: dateTime,
    timeOnly: timeOnly, relativeDay: relativeDay, initials: initials,
    icon: icon, ICONS: ICONS,
    resPill: resPill, roomPill: roomPill, cardPill: cardPill,
    ROOM_STATUS: ROOM_STATUS, RES_STATUS: RES_STATUS,
    person: person,
    toast: toast,
    openModal: openModal, closeModal: closeModal, confirmModal: confirmModal,
    barChart: barChart, splitBar: splitBar, empty: empty
  };
})();


/* ---------- js/views.js ---------- */
/* ==========================================================================
   views.js — one render function per screen. Each returns an HTML string
   that app.js drops into the content area; interaction is handled by
   delegated listeners in app.js keyed on data-action attributes.
   ========================================================================== */

var Views = (function () {
  "use strict";

  var esc = UI.esc, icon = UI.icon, money = UI.money;

  /* Filter state persists while the user moves between screens. */
  var filters = {
    roomStatus: "all",
    roomFloor: "all",
    resStatus: "all",
    resSearch: "",
    guestSearch: "",
    cardStatus: "all",
    doorResult: "all",
    doorSearch: "",
    reportDays: 14
  };

  function kpi(o) {
    return '<div class="kpi">' +
      '<div class="kpi-top">' +
        '<span class="kpi-ico c-' + o.tone + '">' + icon(o.icon) + "</span>" +
        '<span class="kpi-label">' + esc(o.label) + "</span>" +
      "</div>" +
      '<div class="kpi-value num">' + o.value + "</div>" +
      (o.foot ? '<div class="kpi-foot">' + o.foot + "</div>" : "") +
      (o.meter !== undefined ? '<div class="meter"><i style="width:' + o.meter + '%"></i></div>' : "") +
      "</div>";
  }

  /* ==================================================================== */
  /* Dashboard                                                            */
  /* ==================================================================== */

  function dashboard() {
    var k = Store.kpis();
    var arrivals = Store.arrivalsToday();
    var departures = Store.departuresToday();
    var counts = Store.statusCounts();
    var anomalies = Store.accessAnomalies();
    var series = Store.occupancySeries(14);

    var html = '<div class="kpi-grid">' +
      kpi({ tone: "primary", icon: "chart", label: "Occupancy", value: k.occupancy + '<small>%</small>',
            foot: k.occupied + " of " + k.totalRooms + " rooms", meter: k.occupancy }) +
      kpi({ tone: "ok", icon: "login", label: "Arrivals today", value: k.arrivals,
            foot: k.arrivals ? "Awaiting check-in" : "All arrivals handled" }) +
      kpi({ tone: "info", icon: "logout", label: "Departures today", value: k.departures,
            foot: k.departures ? "Due out by 11:00" : "All departures settled" }) +
      kpi({ tone: "primary", icon: "guests", label: "Guests in house", value: k.guestsInHouse,
            foot: k.inHouse + " active reservations" }) +
      kpi({ tone: "ok", icon: "money", label: "Room revenue today", value: UI.moneyShort(k.revenueToday),
            foot: "Excludes extras and F&amp;B" }) +
      "</div>";

    /* --- arrivals / departures --- */
    html += '<div class="grid-2">';

    html += '<div class="panel"><div class="panel-head">' +
      "<h2>Arrivals today</h2>" +
      '<span class="sub">' + arrivals.length + " expected</span>" +
      "</div>";
    if (!arrivals.length) {
      html += UI.empty("No arrivals left", "Every booking due in today has been checked in.");
    } else {
      html += '<div class="panel-body flush"><div class="table-scroll"><table class="tbl"><thead><tr>' +
        "<th>Guest</th><th>Room</th><th>Nights</th><th></th></tr></thead><tbody>";
      arrivals.forEach(function (r) {
        var room = Store.roomById(r.roomId);
        html += "<tr>" +
          "<td>" + UI.person(r.guestName, r.code) + "</td>" +
          '<td class="strong">' + esc(room ? room.number : "—") + "</td>" +
          "<td>" + Store.nightsBetween(r.checkIn, r.checkOut) + "</td>" +
          '<td class="actions"><button class="btn btn-soft btn-sm" data-action="check-in" data-id="' + r.id + '">' +
            icon("login") + "Check in</button></td>" +
          "</tr>";
      });
      html += "</tbody></table></div></div>";
    }
    html += "</div>";

    html += '<div class="panel"><div class="panel-head">' +
      "<h2>Departures today</h2>" +
      '<span class="sub">' + departures.length + " due out</span>" +
      "</div>";
    if (!departures.length) {
      html += UI.empty("No departures", "Nobody is due to check out today.");
    } else {
      html += '<div class="panel-body flush"><div class="table-scroll"><table class="tbl"><thead><tr>' +
        "<th>Guest</th><th>Room</th><th>Folio</th><th></th></tr></thead><tbody>";
      departures.forEach(function (r) {
        var room = Store.roomById(r.roomId);
        html += "<tr>" +
          "<td>" + UI.person(r.guestName, r.code) + "</td>" +
          '<td class="strong">' + esc(room ? room.number : "—") + "</td>" +
          '<td class="num">' + esc(UI.moneyShort(Store.folioTotal(r))) + "</td>" +
          '<td class="actions"><button class="btn btn-ghost btn-sm" data-action="check-out" data-id="' + r.id + '">' +
            icon("logout") + "Check out</button></td>" +
          "</tr>";
      });
      html += "</tbody></table></div></div>";
    }
    html += "</div></div>";

    /* --- occupancy trend + room status --- */
    html += '<div class="grid-wide" style="margin-top:16px">';

    html += '<div class="panel"><div class="panel-head"><h2>Occupancy, last 14 days</h2>' +
      '<span class="sub">Average ' + Store.performance(14).avgOccupancy + "%</span></div>" +
      '<div class="panel-body">' +
      UI.barChart(series.map(function (d) {
        return { label: UI.dateShort(d.date).split(" ")[0], value: d.rate };
      }), { format: function (v) { return v + "%"; } }) +
      "</div></div>";

    html += '<div class="panel"><div class="panel-head"><h2>Room status</h2></div><div class="panel-body">' +
      UI.splitBar([
        { label: "Available", value: counts.available, color: "var(--ok)", display: counts.available },
        { label: "Occupied", value: counts.occupied, color: "var(--info)", display: counts.occupied },
        { label: "Needs cleaning", value: counts.dirty, color: "var(--warn)", display: counts.dirty },
        { label: "Out of order", value: counts.maintenance, color: "var(--danger)", display: counts.maintenance }
      ]) + "</div></div>";

    html += "</div>";

    /* --- access alerts --- */
    html += '<div class="panel" style="margin-top:16px"><div class="panel-head">' +
      "<h2>Access control alerts</h2>" +
      '<span class="sub">From the door audit log</span>' +
      '<button class="btn btn-ghost btn-sm" data-nav="access">Open audit log</button>' +
      "</div>";
    if (!anomalies.length) {
      html += UI.empty("Nothing flagged", "No unusual door activity in the current log.");
    } else {
      html += '<div class="panel-body"><div class="stack">';
      anomalies.slice(0, 4).forEach(function (a) {
        html += '<div class="alert alert-' + (a.severity === "high" ? "danger" : "warn") + '">' +
          icon("alert") + "<div><b>" + esc(a.title) + "</b><p>" + esc(a.detail) + "</p></div></div>";
      });
      html += "</div></div>";
    }
    html += "</div>";

    return html;
  }

  /* ==================================================================== */
  /* Rooms                                                                */
  /* ==================================================================== */

  function rooms() {
    var all = Store.rooms();
    var list = all.filter(function (r) {
      if (filters.roomStatus !== "all" && r.status !== filters.roomStatus) return false;
      if (filters.roomFloor !== "all" && String(r.floor) !== filters.roomFloor) return false;
      return true;
    });

    var floors = {};
    all.forEach(function (r) { floors[r.floor] = true; });

    var html = '<div class="panel"><div class="panel-head">' +
      "<h2>Rooms</h2>" +
      '<span class="sub">' + list.length + " of " + all.length + "</span>" +
      '<div class="filters" style="margin-left:auto">' +
        '<select class="select auto" data-filter="roomStatus">' +
          option("all", "All statuses", filters.roomStatus) +
          option("available", "Available", filters.roomStatus) +
          option("occupied", "Occupied", filters.roomStatus) +
          option("dirty", "Needs cleaning", filters.roomStatus) +
          option("maintenance", "Out of order", filters.roomStatus) +
        "</select>" +
        '<select class="select auto" data-filter="roomFloor">' +
          option("all", "All floors", filters.roomFloor) +
          Object.keys(floors).map(function (f) {
            return option(f, "Floor " + f, filters.roomFloor);
          }).join("") +
        "</select>" +
      "</div></div>";

    html += '<div class="panel-body">' +
      '<div class="legend" style="margin-bottom:14px">' +
        '<span><i class="lg-available"></i>Available</span>' +
        '<span><i class="lg-occupied"></i>Occupied</span>' +
        '<span><i class="lg-dirty"></i>Needs cleaning</span>' +
        '<span><i class="lg-maintenance"></i>Out of order</span>' +
      "</div>";

    if (!list.length) {
      html += UI.empty("No rooms match", "Try a different status or floor.");
    } else {
      html += '<div class="room-grid">';
      list.forEach(function (r) {
        var res = Store.reservationForRoom(r.id);
        var type = Store.ROOM_TYPES[r.type];
        html += '<button class="room-card" data-status="' + r.status + '" data-action="room-detail" data-id="' + r.id + '">' +
          '<div class="rc-top"><span class="rc-no num">' + esc(r.number) + "</span>" +
          '<span class="rc-type">' + esc(type.label) + "</span></div>" +
          '<div class="rc-guest">' + (res ? "<b>" + esc(res.guestName) + "</b>" : '<span class="dim">Vacant</span>') + "</div>" +
          '<div class="rc-foot">' + UI.roomPill(r.status) +
          '<span class="rc-rate num">' + esc(UI.moneyShort(r.rate)) + "</span></div>" +
          "</button>";
      });
      html += "</div>";
    }
    html += "</div></div>";
    return html;
  }

  function roomDetailBody(roomId) {
    var room = Store.roomById(roomId);
    if (!room) return UI.empty("Room not found");
    var type = Store.ROOM_TYPES[room.type];
    var res = Store.reservationForRoom(room.id);
    var card = Store.activeCardFor(room.id);
    var recent = Store.doorEvents().filter(function (e) { return e.roomId === room.id; }).slice(0, 6);

    var html = '<dl class="detail-list">' +
      row("Status", UI.roomPill(room.status)) +
      row("Room type", esc(type.label) + " &middot; " + esc(type.beds)) +
      row("Floor", esc(String(room.floor))) +
      row("Rack rate", '<span class="num">' + esc(money(room.rate)) + "</span> / night") +
      row("Max occupancy", esc(String(type.cap)) + " guests") +
      row("Door lock", '<span class="code">' + esc(room.lockId) + "</span>") +
      row("Clock drift", room.clockDriftSec > 60

        : '<span class="pill pill-ok">In sync</span>') +
      "</dl>";

    if (res) {
      html += '<h3 style="margin:18px 0 10px;font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)">Current guest</h3>' +
        '<div class="summary-box"><dl class="detail-list">' +
        row("Guest", esc(res.guestName)) +
        row("Reservation", '<span class="code">' + esc(res.code) + "</span>") +
        row("Staying", UI.dateShort(res.checkIn) + " &rarr; " + UI.dateShort(res.checkOut)) +
        row("Folio balance", '<span class="num">' + esc(money(Store.folioTotal(res))) + "</span>") +
        row("Key card", card ? '<span class="code">' + esc(card.cardNumber) + "</span>" : '<span class="dim">None issued</span>') +
        "</dl></div>";
    }

    if (recent.length) {
      html += '<h3 style="margin:18px 0 10px;font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)">Recent door activity</h3>' +
        '<div class="panel"><div class="event-list">';
      recent.forEach(function (e) { html += eventRow(e); });
      html += "</div></div>";
    }

    html += '<div class="btn-row" style="margin-top:18px">';
    if (room.status === "dirty") {
      html += '<button class="btn btn-soft btn-sm" data-action="room-status" data-id="' + room.id + '" data-value="available">' + icon("check") + "Mark cleaned</button>";
    }
    if (room.status === "available") {
      html += '<button class="btn btn-ghost btn-sm" data-action="room-status" data-id="' + room.id + '" data-value="dirty">' + icon("broom") + "Flag for cleaning</button>";
    }
    if (room.status !== "occupied" && room.status !== "maintenance") {
      html += '<button class="btn btn-danger btn-sm" data-action="room-status" data-id="' + room.id + '" data-value="maintenance">' + icon("wrench") + "Take out of order</button>";
    }
    if (room.status === "maintenance") {
      html += '<button class="btn btn-soft btn-sm" data-action="room-status" data-id="' + room.id + '" data-value="available">' + icon("check") + "Return to service</button>";
    }
    if (room.clockDriftSec > 60) {
      html += '<button class="btn btn-ghost btn-sm" data-action="resync-lock" data-id="' + room.id + '">' + icon("refresh") + "Re-sync lock clock</button>";
    }
    if (res) {
      html += '<button class="btn btn-ghost btn-sm" data-action="check-out" data-id="' + res.id + '">' + icon("logout") + "Check out guest</button>";
    }
    html += "</div>";

    return html;
  }

  /* ==================================================================== */

  function reservations() {
    var all = Store.reservations();
    var q = filters.resSearch.toLowerCase().trim();

    var list = all.filter(function (r) {
      if (filters.resStatus !== "all" && r.status !== filters.resStatus) return false;
      if (!q) return true;
      var room = Store.roomById(r.roomId);
      return r.guestName.toLowerCase().indexOf(q) > -1 ||
             r.code.toLowerCase().indexOf(q) > -1 ||
             (room && room.number.indexOf(q) > -1);
    }).sort(function (a, b) { return a.checkIn < b.checkIn ? 1 : -1; });

    var html = '<div class="panel"><div class="panel-head">' +
      "<h2>Reservations</h2>" +
      '<span class="sub">' + list.length + " of " + all.length + "</span>" +
      '<div class="filters" style="margin-left:auto">' +
        '<div class="search">' + icon("search") +
          '<input class="input" type="search" placeholder="Guest, code or room" data-filter="resSearch" value="' + esc(filters.resSearch) + '">' +
        "</div>" +
        '<select class="select auto" data-filter="resStatus">' +
          option("all", "All statuses", filters.resStatus) +
          option("confirmed", "Confirmed", filters.resStatus) +
          option("in-house", "In house", filters.resStatus) +
          option("checked-out", "Checked out", filters.resStatus) +
          option("cancelled", "Cancelled", filters.resStatus) +
          option("no-show", "No show", filters.resStatus) +
        "</select>" +
        '<button class="btn btn-primary btn-sm" data-action="new-reservation">' + icon("plus") + "New booking</button>" +
      "</div></div>";

    if (!list.length) {
      html += UI.empty("No reservations match", "Adjust the search or status filter.");
    } else {
      var CAP = 100;
      html += '<div class="panel-body flush"><div class="table-scroll"><table class="tbl"><thead><tr>' +
        "<th>Guest</th><th>Code</th><th>Room</th><th>Check-in</th><th>Check-out</th>" +
        "<th>Nights</th><th>Source</th><th>Status</th><th></th></tr></thead><tbody>";
      list.slice(0, CAP).forEach(function (r) {
        var room = Store.roomById(r.roomId);
        html += '<tr data-action="reservation-detail" data-id="' + r.id + '" style="cursor:pointer">' +
          "<td>" + UI.person(r.guestName) + "</td>" +
          '<td class="code">' + esc(r.code) + "</td>" +
          '<td class="strong num">' + esc(room ? room.number : "—") + "</td>" +
          "<td>" + esc(UI.dateShort(r.checkIn)) + '<div class="dim" style="font-size:.72rem">' + esc(UI.relativeDay(r.checkIn)) + "</div></td>" +
          "<td>" + esc(UI.dateShort(r.checkOut)) + "</td>" +

  /* ==================================================================== */
  /* Key cards & door audit                                               */
  /* ==================================================================== */

  function access() {
    var allCards = Store.cards();
    var cardList = allCards.filter(function (c) {
      return filters.cardStatus === "all" || c.status === filters.cardStatus;
    });

    var q = filters.doorSearch.toLowerCase().trim();
    var events = Store.doorEvents().filter(function (e) {
      if (filters.doorResult !== "all" && e.result !== filters.doorResult) return false;
      if (!q) return true;
      var room = Store.roomById(e.roomId);
      return (room && room.number.indexOf(q) > -1) ||
             e.cardNumber.toLowerCase().indexOf(q) > -1 ||
             e.holder.toLowerCase().indexOf(q) > -1 ||
             e.lockId.toLowerCase().indexOf(q) > -1;
    });

    var anomalies = Store.accessAnomalies();
    var active = allCards.filter(function (c) { return c.status === "active"; }).length;
    var denied = Store.doorEvents().filter(function (e) { return e.result === "denied"; }).length;

    var html = '<div class="kpi-grid">' +
      kpi({ tone: "primary", icon: "key", label: "Active credentials", value: active,
            foot: allCards.length + " cards on file" }) +
      kpi({ tone: "info", icon: "door", label: "Door events logged", value: Store.doorEvents().length,
            foot: "Last 7 days" }) +
      kpi({ tone: "danger", icon: "shield", label: "Refused reads", value: denied,
            foot: denied ? "Review the flagged items" : "Nothing refused" }) +
      kpi({ tone: "warn", icon: "alert", label: "Open alerts", value: anomalies.length,
            foot: "Detected by audit rules" }) +
      "</div>";

    /* --- anomalies --- */
    html += '<div class="panel"><div class="panel-head"><h2>Flagged activity</h2>' +
      '<span class="sub">Rules run over the door log</span></div>';
    if (!anomalies.length) {
      html += UI.empty("Nothing flagged", "The audit rules found no unusual activity.");
    } else {
      html += '<div class="panel-body"><div class="stack">';
      anomalies.forEach(function (a) {
        html += '<div class="alert alert-' + (a.severity === "high" ? "danger" : "warn") + '">' +
          icon("alert") + "<div><b>" + esc(a.title) + "</b><p>" + esc(a.detail) + "</p></div></div>";
      });
      html += "</div></div>";
    }
    html += "</div>";

    /* --- cards --- */
    html += '<div class="panel" style="margin-top:16px"><div class="panel-head">' +
      "<h2>Key cards</h2>" +
      '<span class="sub">' + cardList.length + " shown</span>" +
      '<div class="filters" style="margin-left:auto">' +
        '<select class="select auto" data-filter="cardStatus">' +
          option("all", "All cards", filters.cardStatus) +
          option("active", "Active", filters.cardStatus) +
          option("expired", "Expired", filters.cardStatus) +
          option("revoked", "Revoked", filters.cardStatus) +
        "</select></div></div>";

    if (!cardList.length) {
      html += UI.empty("No cards match", "Change the status filter.");
    } else {
      html += '<div class="panel-body flush"><div class="table-scroll"><table class="tbl"><thead><tr>' +
        "<th>Card UID</th><th>Holder</th><th>Type</th><th>Room / lock</th><th>Issued</th><th>Expires</th><th>Status</th><th></th></tr></thead><tbody>";
      cardList.slice(0, 60).forEach(function (c) {
        var room = c.roomId ? Store.roomById(c.roomId) : null;
        html += "<tr>" +
          '<td class="code strong">' + esc(c.cardNumber) + "</td>" +
          "<td>" + esc(c.holder) + "</td>" +
          '<td><span class="pill pill-neutral no-dot">' + esc(c.type) + "</span></td>" +
          "<td>" + (room ? esc(room.number) + ' <span class="code dim">' + esc(c.lockId) + "</span>" : '<span class="dim">All doors</span>') + "</td>" +
          "<td>" + esc(UI.dateTime(c.issuedAt)) + "</td>" +
          "<td>" + esc(UI.dateTime(c.expiresAt)) + "</td>" +
          "<td>" + UI.cardPill(c.status) + "</td>" +
          '<td class="actions">' +
            (c.status === "active"
              ? '<button class="btn btn-danger btn-sm" data-action="revoke-card" data-id="' + c.id + '">Revoke</button>'
              : '<span class="dim">—</span>') +
          "</td></tr>";
      });
      html += "</tbody></table></div></div>";
    }
    html += "</div>";

    /* --- door log --- */
    html += '<div class="panel" style="margin-top:16px"><div class="panel-head">' +
      "<h2>Door audit log</h2>" +
      '<span class="sub">' + events.length + " events</span>" +
      '<div class="filters" style="margin-left:auto">' +
        '<div class="search">' + icon("search") +
          '<input class="input" type="search" placeholder="Room, card or lock" data-filter="doorSearch" value="' + esc(filters.doorSearch) + '">' +
        "</div>" +
        '<div class="seg" data-seg="doorResult">' +
          segBtn("all", "All", filters.doorResult) +
          segBtn("granted", "Granted", filters.doorResult) +
          segBtn("denied", "Denied", filters.doorResult) +
        "</div>" +
      "</div></div>";

    if (!events.length) {
      html += UI.empty("No matching events", "Adjust the search or filter.");
    } else {
      html += '<div class="panel-body flush"><div class="table-scroll"><table class="tbl"><thead><tr>' +
        "<th>Time</th><th>Room</th><th>Lock</th><th>Card</th><th>Holder</th><th>Result</th><th>Note</th></tr></thead><tbody>";
      events.slice(0, 120).forEach(function (e) {
        var room = Store.roomById(e.roomId);
        html += "<tr>" +
          '<td class="nowrap">' + esc(UI.dateTime(e.ts)) + "</td>" +
          '<td class="strong num">' + esc(room ? room.number : "—") + "</td>" +
          '<td class="code dim">' + esc(e.lockId) + "</td>" +
          '<td class="code">' + esc(e.cardNumber) + "</td>" +
          "<td>" + esc(e.holder) + "</td>" +
          "<td>" + (e.result === "granted"
            ? '<span class="pill pill-ok">Granted</span>'
            : '<span class="pill pill-danger">Denied</span>') + "</td>" +
          '<td class="dim">' + esc(e.reason || "—") + "</td>" +
          "</tr>";
      });
      html += "</tbody></table></div>";
      if (events.length > 120) {
        html += '<div style="padding:10px 14px;font-size:.76rem" class="dim">Showing the 120 most recent of ' + events.length + " matching events.</div>";
      }
      html += "</div>";
    }
    html += "</div>";
    return html;
  }

          '<td class="strong num">' + esc(r.number) + "</td>" +

          '<td class="num">' + r.floor + "</td>" +
          '<td class="actions"><button class="btn btn-ghost btn-sm" data-action="room-status" data-id="' + r.id + '" data-value="available">' +

          '<div class="rc-top"><span class="rc-no num">' + esc(r.number) + "</span></div>" +
          '<div class="rc-foot" style="margin-top:9px">' + UI.roomPill(r.status) + "</div></button>";
      });

    return html;

  /* ==================================================================== */
  /* Reports                                                              */
  /* ==================================================================== */

  function reports() {
    var days = filters.reportDays;
    var perf = Store.performance(days);
    var byType = Store.revenueByType(days);
    var mix = Store.sourceMix();

    var html = '<div class="panel"><div class="panel-head"><h2>Performance</h2>' +
      '<div class="seg" data-seg="reportDays" style="margin-left:auto">' +
        segBtn("7", "7 days", String(days)) +
        segBtn("14", "14 days", String(days)) +
        segBtn("30", "30 days", String(days)) +
      "</div></div><div class=\"panel-body\">";

    html += '<div class="kpi-grid" style="margin-bottom:0">' +
      kpi({ tone: "primary", icon: "chart", label: "Average occupancy", value: perf.avgOccupancy + "<small>%</small>",
            foot: perf.roomNights + " room nights sold", meter: perf.avgOccupancy }) +
      kpi({ tone: "ok", icon: "money", label: "Room revenue", value: UI.moneyShort(perf.revenue),
            foot: "Over " + days + " days" }) +
      kpi({ tone: "info", icon: "trend", label: "ADR", value: UI.moneyShort(perf.adr),
            foot: "Average daily rate" }) +
      kpi({ tone: "primary", icon: "bed", label: "RevPAR", value: UI.moneyShort(perf.revpar),
            foot: "Revenue per available room" }) +
      "</div></div></div>";

    html += '<div class="grid-2" style="margin-top:16px">';

    html += '<div class="panel"><div class="panel-head"><h2>Daily occupancy</h2>' +
      '<span class="sub">Percent of rooms sold</span></div><div class="panel-body">' +
      UI.barChart(perf.series.map(function (d) {
        return { label: UI.dateShort(d.date).split(" ")[0], value: d.rate };
      }), { format: function (v) { return v + "%"; } }) + "</div></div>";

    html += '<div class="panel"><div class="panel-head"><h2>Daily room revenue</h2>' +
      '<span class="sub">' + esc(UI.moneyShort(perf.revenue)) + " total</span></div><div class=\"panel-body\">" +
      UI.barChart(perf.series.map(function (d) {
        return { label: UI.dateShort(d.date).split(" ")[0], value: d.revenue, alt: true };
      }), { format: UI.moneyShort }) + "</div></div>";

    html += "</div>";

    html += '<div class="grid-2" style="margin-top:16px">';

    var typeColors = { standard: "var(--info)", twin: "var(--ok)", deluxe: "var(--primary)", suite: "var(--warn)" };
    var typeRows = Object.keys(byType).map(function (k) {
      return {
        label: Store.ROOM_TYPES[k].label,
        value: byType[k],
        color: typeColors[k],
        display: UI.moneyShort(byType[k])
      };
    }).sort(function (a, b) { return b.value - a.value; });

    html += '<div class="panel"><div class="panel-head"><h2>Revenue by room type</h2></div>' +
      '<div class="panel-body">' + UI.splitBar(typeRows) + "</div></div>";

    var mixColors = ["var(--primary)", "var(--info)", "var(--ok)", "var(--warn)", "var(--neutral)"];
    var mixRows = Object.keys(mix).map(function (k, i) {
      return { label: k, value: mix[k], color: mixColors[i % mixColors.length], display: mix[k] };
    }).sort(function (a, b) { return b.value - a.value; });

    html += '<div class="panel"><div class="panel-head"><h2>Booking sources</h2>' +
      '<span class="sub">All reservations on file</span></div>' +
      '<div class="panel-body">' + UI.splitBar(mixRows) + "</div></div>";

    html += "</div>";

    html += '<div class="panel" style="margin-top:16px"><div class="panel-head"><h2>Daily breakdown</h2></div>' +
      '<div class="panel-body flush"><div class="table-scroll"><table class="tbl"><thead><tr>' +
      "<th>Date</th><th>Rooms sold</th><th>Occupancy</th><th>Room revenue</th><th>ADR</th></tr></thead><tbody>";
    perf.series.slice().reverse().forEach(function (d) {
      html += "<tr>" +
        "<td>" + esc(UI.dateLong(d.date)) + "</td>" +
        '<td class="num">' + d.rooms + "</td>" +
        '<td class="num">' + d.rate + "%</td>" +
        '<td class="num">' + esc(money(d.revenue)) + "</td>" +
        '<td class="num">' + esc(d.rooms ? UI.moneyShort(Math.round(d.revenue / d.rooms)) : "—") + "</td>" +
        "</tr>";
    });
    html += "</tbody></table></div></div></div>";

    return html;
  }

  /* ==================================================================== */
  /* Forms                                                                */
  /* ==================================================================== */

  function newReservationForm() {
    var t = Store.today();
    var tomorrow = Store.iso(Store.addDays(Store.parseISO(t), 1));
    var sellable = Store.rooms().filter(function (r) { return r.status !== "maintenance"; });

    return '<form id="resForm" novalidate><div class="form-grid">' +
      field("Guest name", '<input class="input" name="guestName" required data-autofocus placeholder="e.g. Amina Hassan">', "full") +
      field("Phone", '<input class="input" name="phone" placeholder="+255 7•• ••• •••">') +
      field("Email", '<input class="input" name="email" type="email" placeholder="guest@example.com">') +
      field("Room", '<select class="select" name="roomId">' +
        sellable.map(function (r) {
          return '<option value="' + r.id + '">' + esc(r.number) + " — " +
            esc(Store.ROOM_TYPES[r.type].label) + " — " + esc(UI.moneyShort(r.rate)) + "</option>";
        }).join("") + "</select>") +
      field("Source", '<select class="select" name="source">' +
        Store.SOURCES.map(function (s) { return '<option value="' + esc(s) + '">' + esc(s) + "</option>"; }).join("") +
        "</select>") +
      field("Check-in", '<input class="input" name="checkIn" type="date" value="' + t + '">') +

      field("Adults", '<input class="input" name="adults" type="number" min="1" max="4" value="2">') +
      field("Children", '<input class="input" name="children" type="number" min="0" max="4" value="0">') +

  function addChargeForm() {
    return '<form id="chargeForm" novalidate><div class="form-grid">' +
      field("Description", '<input class="input" name="desc" data-autofocus placeholder="e.g. Restaurant — dinner">', "full") +
      field("Amount (TZS)", '<input class="input" name="amount" type="number" min="0" step="500" placeholder="25000">', "full") +

  /* ==================================================================== */
  /* small builders                                                       */
  /* ==================================================================== */

  function row(label, value) {
    return '<div class="detail-row"><dt>' + label + "</dt><dd>" + value + "</dd></div>";
  }
  function sectionTitle(t) {
    return '<h3 style="margin:18px 0 10px;font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)">' + esc(t) + "</h3>";
  }
  function option(value, label, current) {
    return '<option value="' + esc(value) + '"' + (String(current) === String(value) ? " selected" : "") + ">" + esc(label) + "</option>";
  }
  function segBtn(value, label, current) {
    return '<button type="button" data-value="' + esc(value) + '"' +
      (String(current) === String(value) ? ' class="on"' : "") + ">" + esc(label) + "</button>";
  }
  function field(label, control, cls) {
    return '<div class="field' + (cls ? " " + cls : "") + '"><label>' + esc(label) + "</label>" + control + "</div>";
  }
  function eventRow(e) {
    var ok = e.result === "granted";
    return '<div class="event">' +
      '<span class="ev-ico" style="background:var(--' + (ok ? "ok" : "danger") + '-soft);color:var(--' + (ok ? "ok" : "danger") + ')">' +
        icon(ok ? "check" : "close") + "</span>" +
      '<span class="ev-body"><b>' + esc(e.holder) + "</b> " +
        (ok ? "opened the door" : "was refused") +
        (e.reason ? ' <span class="dim">— ' + esc(e.reason) + "</span>" : "") +
      "</span>" +
      '<span class="ev-time">' + esc(UI.dateTime(e.ts)) + "</span>" +
      "</div>";

  /* ==================================================================== */
  return {
    filters: filters,
    dashboard: dashboard,
    rooms: rooms, roomDetailBody: roomDetailBody,
    reservations: reservations, reservationDetailBody: reservationDetailBody,
    guests: guests, guestDetailBody: guestDetailBody,
    access: access,
    housekeeping: housekeeping,
    reports: reports,
    newReservationForm: newReservationForm,
    addChargeForm: addChargeForm
  };
})();


/* ---------- js/app.js ---------- */
/* ==========================================================================
   app.js — routing, rendering, and all event handling.
   Interaction uses a single delegated click listener keyed on data-action,
   so re-rendering a view never leaves stale listeners behind.
   ========================================================================== */

(function () {
  "use strict";

  var VIEWS = {
    dashboard:    { title: "Dashboard",        sub: "Today at a glance",                     render: function () { return Views.dashboard(); } },
    rooms:        { title: "Rooms",            sub: "Live status of every room",             render: function () { return Views.rooms(); } },
    reservations: { title: "Reservations",     sub: "Bookings, check-in and check-out",      render: function () { return Views.reservations(); } },
    guests:       { title: "Guests",           sub: "Directory and stay history",            render: function () { return Views.guests(); } },
    access:       { title: "Key cards & access", sub: "Credentials and the door audit trail", render: function () { return Views.access(); } },
    housekeeping: { title: "Housekeeping",     sub: "Cleaning queue and floor board",        render: function () { return Views.housekeeping(); } },
    reports:      { title: "Reports",          sub: "Occupancy, ADR and RevPAR",             render: function () { return Views.reports(); } }
  };

  var current = "dashboard";
  var contentEl, titleEl, subEl;

  /* ------------------------------------------------------------ routing */

  function viewFromHash() {
    var h = (location.hash || "").replace(/^#\/?/, "");
    return VIEWS[h] ? h : "dashboard";
  }

  function go(view) {
    if (!VIEWS[view]) view = "dashboard";
    current = view;
    if (location.hash !== "#/" + view) {
      location.hash = "#/" + view;
      return; /* hashchange will call render() */
    }
    render();
  }

  function render() {
    var v = VIEWS[current];
    titleEl.textContent = v.title;
    subEl.textContent = v.sub;
    contentEl.innerHTML = v.render();
    contentEl.scrollTop = 0;
    window.scrollTo(0, 0);
    paintNav();
  }

  function paintNav() {
    var counts = {
      reservations: Store.arrivalsToday().length,
      housekeeping: Store.statusCounts().dirty,
      access: Store.accessAnomalies().length
    };
    Array.prototype.forEach.call(document.querySelectorAll(".nav-item"), function (el) {
      var view = el.getAttribute("data-nav");
      el.classList.toggle("active", view === current);
      var badge = el.querySelector(".count");
      var n = counts[view];
      if (badge) {
        if (n) { badge.textContent = n; badge.style.display = ""; }
        else { badge.style.display = "none"; }
      }
    });
  }

  /* ------------------------------------------------------------ sidebar */

  function toggleSidebar(open) {
    var sb = document.querySelector(".sidebar");
    var scrim = document.querySelector(".scrim");
    var show = open === undefined ? !sb.classList.contains("open") : open;
    sb.classList.toggle("open", show);
    if (scrim) scrim.classList.toggle("on", show);
  }

  /* ------------------------------------------------------------ actions */

  function doCheckIn(resId) {
    var res = Store.reservationById(resId);
    if (!res) return;
    var room = Store.roomById(res.roomId);

    UI.openModal({
      title: "Check in " + res.guestName,
      subtitle: res.code + " · Room " + (room ? room.number : "—"),
      body:
        '<div class="summary-box"><dl class="detail-list">' +
          detailRow("Room", room ? UI.esc(room.number) + " · " + UI.esc(Store.ROOM_TYPES[room.type].label) : "—") +
          detailRow("Room status", room ? UI.roomPill(room.status) : "—") +
          detailRow("Staying", UI.dateLong(res.checkIn) + " &rarr; " + UI.dateLong(res.checkOut)) +
          detailRow("Nights", String(Store.nightsBetween(res.checkIn, res.checkOut))) +
          detailRow("Rate", '<span class="num">' + UI.money(res.rate) + "</span> / night") +
          detailRow("Room charges", '<span class="num">' +
            UI.money(res.rate * Store.nightsBetween(res.checkIn, res.checkOut)) + "</span>") +
        "</dl></div>" +
        '<div class="alert alert-info" style="margin-top:14px">' + UI.icon("key") +
          "<div><b>A key card will be encoded</b><p>The card is bound to lock " +
          UI.esc(room ? room.lockId : "—") + " and expires at check-out, 11:00 on " +
          UI.esc(UI.dateLong(res.checkOut)) + ".</p></div></div>",
      confirmText: "Check in & encode card",
      onConfirm: function () {
        var result = Store.checkIn(resId);
        UI.closeModal();
        if (!result.ok) {
          UI.toast("err", "Check-in blocked", result.error);
          return;
        }
        UI.toast("ok", "Checked in", res.guestName + " is now in room " + result.room.number + ".");
        showCardIssued(result.card, result.room);
        render();
      }
    });
  }

  function showCardIssued(card, room) {
    if (!card) return;
    setTimeout(function () {
      UI.openModal({
        title: "Key card encoded",
        subtitle: "Room " + room.number + " · lock " + room.lockId,
        body:
          '<div class="summary-box"><dl class="detail-list">' +
            detailRow("Card UID", '<span class="code">' + UI.esc(card.cardNumber) + "</span>") +
            detailRow("Holder", UI.esc(card.holder)) +
            detailRow("Lock", '<span class="code">' + UI.esc(card.lockId) + "</span>") +
            detailRow("Valid until", UI.dateTime(card.expiresAt)) +
            detailRow("Status", UI.cardPill(card.status)) +
          "</dl></div>" +
          '<p class="dim" style="font-size:.76rem;margin-top:12px">Every encode and every door read is written to the audit log.</p>',
        confirmText: "Open audit log",
        cancelText: "Done",
        onConfirm: function () { UI.closeModal(); go("access"); }
      });
    }, 180);
  }

  function doCheckOut(resId) {
    var res = Store.reservationById(resId);
    if (!res) return;
    var room = Store.roomById(res.roomId);
    var total = Store.folioTotal(res);

    var folio = "";
    (res.folio || []).forEach(function (i) {
      folio += '<div class="folio-row"><span class="fd">' + UI.esc(UI.dateShort(i.date)) +
        " &middot; " + UI.esc(i.desc) + '</span><span class="num">' + UI.esc(UI.money(i.amount)) + "</span></div>";
    });

    UI.openModal({
      title: "Check out " + res.guestName,
      subtitle: res.code + " · Room " + (room ? room.number : "—"),
      body:
        '<div class="summary-box">' + (folio || '<p class="dim">No charges posted.</p>') +
          '<div class="folio-total"><span>Balance due</span><span class="num">' + UI.esc(UI.money(total)) + "</span></div>" +
        "</div>" +
        '<div class="alert alert-warn" style="margin-top:14px">' + UI.icon("key") +
          "<div><b>Key card will be expired</b><p>The guest credential for lock " +
          UI.esc(room ? room.lockId : "—") + " stops working immediately, and room " +
          UI.esc(room ? room.number : "—") + " moves to the cleaning queue.</p></div></div>",
      confirmText: "Settle & check out",
      onConfirm: function () {
        var result = Store.checkOut(resId);
        UI.closeModal();
        if (!result.ok) {
          UI.toast("err", "Check-out failed", result.error);
          return;
        }
        UI.toast("ok", "Checked out", UI.money(result.total) + " settled. Room " + result.room.number + " sent to housekeeping.");
        render();
      }
    });
  }

  function doNewReservation() {
    UI.openModal({
      title: "New booking",
      subtitle: "Rooms out of order are not offered",
      wide: true,
      body: Views.newReservationForm(),
      confirmText: "Create booking",
      onConfirm: function () {
        var form = document.getElementById("resForm");
        if (!form) return;
        var data = {
          guestName: form.guestName.value,
          phone: form.phone.value,
          email: form.email.value,
          roomId: form.roomId.value,
          source: form.source.value,
          checkIn: form.checkIn.value,
          checkOut: form.checkOut.value,
          adults: form.adults.value,
          children: form.children.value,
          notes: form.notes.value
        };
        var result = Store.createReservation(data);
        if (!result.ok) {
          var box = document.getElementById("resFormError");
          if (box) {
            box.style.display = "";
            box.querySelector("p").textContent = result.error;
          }
          return;
        }
        UI.closeModal();
        UI.toast("ok", "Booking created", result.reservation.code + " for " + result.reservation.guestName + ".");
        go("reservations");
      }
    });
  }

  function doAddCharge(resId) {
    UI.openModal({
      title: "Post a charge",
      subtitle: "Adds a line to the guest folio",
      body: Views.addChargeForm(),
      confirmText: "Post charge",
      onConfirm: function () {
        var form = document.getElementById("chargeForm");
        if (!form) return;
        var desc = form.desc.value.trim();
        var amount = Number(form.amount.value);
        if (!desc || !(amount > 0)) {
          UI.toast("warn", "Check the details", "Enter a description and an amount above zero.");
          return;
        }
        Store.addFolioItem(resId, desc, amount);
        UI.closeModal();
        UI.toast("ok", "Charge posted", desc + " — " + UI.money(amount));
        render();
      }
    });
  }

  function openRoom(roomId) {
    var room = Store.roomById(roomId);
    if (!room) return;
    UI.openModal({
      title: "Room " + room.number,
      subtitle: Store.ROOM_TYPES[room.type].label + " · floor " + room.floor,
      body: Views.roomDetailBody(roomId),
      actions: false
    });
  }

  function openReservation(resId) {
    var res = Store.reservationById(resId);
    if (!res) return;
    UI.openModal({
      title: res.guestName,
      subtitle: res.code,
      wide: true,
      body: Views.reservationDetailBody(resId),
      actions: false
    });
  }

  function openGuest(guestId) {
    var g = Store.guestById(guestId);
    if (!g) return;
    UI.openModal({
      title: g.name,
      subtitle: g.nationality,
      wide: true,
      body: Views.guestDetailBody(guestId),
      actions: false
    });
  }

  function doReset() {
    UI.openModal({
      title: "Reset demo data",
      subtitle: "Restores the sample property to its starting state",
      body: '<p>Every booking, key card and door event you have created will be discarded and the ' +
            'original sample data regenerated for today&rsquo;s date.</p>',
      confirmText: "Reset data",
      confirmKind: "btn-danger",
      onConfirm: function () {
        Store.reset();
        UI.closeModal();
        UI.toast("ok", "Demo data reset", "The property is back to its starting state.");
        go("dashboard");
      }
    });
  }

  function detailRow(label, value) {
    return '<div class="detail-row"><dt>' + label + "</dt><dd>" + value + "</dd></div>";
  }

  /* ------------------------------------------------------------ events */

  function onClick(ev) {
    var t = ev.target;
    /* Clicks can land on text or SVG nodes, which have no closest(). */
    if (!t || typeof t.closest !== "function") return;

    /* modal chrome */
    if (t.closest("[data-modal-close]")) { UI.closeModal(); return; }
    if (t.closest("[data-modal-confirm]")) { UI.confirmModal(); return; }

    /* segmented controls */
    var seg = t.closest("[data-seg] button");
    if (seg) {
      var segKey = seg.parentNode.getAttribute("data-seg");
      var val = seg.getAttribute("data-value");
      Views.filters[segKey] = segKey === "reportDays" ? Number(val) : val;
      render();
      return;
    }

    /* navigation */
    var nav = t.closest("[data-nav]");
    if (nav) {
      ev.preventDefault();
      go(nav.getAttribute("data-nav"));
      if (window.innerWidth <= 900) toggleSidebar(false);
      return;
    }

    /* everything else */
    var el = t.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");
    var value = el.getAttribute("data-value");

    switch (action) {
      case "check-in":          doCheckIn(id); break;
      case "check-out":         doCheckOut(id); break;
      case "new-reservation":   doNewReservation(); break;
      case "add-charge":        UI.closeModal(); doAddCharge(id); break;
      case "room-detail":       openRoom(id); break;
      case "reservation-detail": openReservation(id); break;
      case "guest-detail":      openGuest(id); break;

      case "room-status": {
        var ok = Store.setRoomStatus(id, value);
        var room = Store.roomById(id);
        if (!ok) {
          UI.toast("warn", "Cannot change status", "Check the guest out before freeing the room.");
        } else {
          UI.toast("ok", "Room " + room.number + " updated", UI.ROOM_STATUS[value].label + ".");
        }
        UI.closeModal();
        render();
        break;
      }

      case "revoke-card": {
        var card = Store.cardById(id);
        if (Store.revokeCard(id)) {
          Store.logDoorEvent(card.roomId, card, "denied", "Credential revoked by front office");
          UI.toast("ok", "Card revoked", card.cardNumber + " will no longer open the door.");
        } else {
          UI.toast("warn", "Nothing to revoke", "That card is not active.");
        }
        render();
        break;
      }

      case "reissue-card": {
        var newCard = Store.issueCard(id, "guest");
        UI.closeModal();
        if (newCard) {
          var r = Store.roomById(newCard.roomId);
          UI.toast("ok", "New card encoded", newCard.cardNumber + " for room " + r.number + ".");
          Store.logDoorEvent(newCard.roomId, newCard, "granted", "Replacement card encoded");
        }
        render();
        break;
      }

      case "cancel-reservation": {
        if (Store.cancelReservation(id)) {
          UI.toast("ok", "Booking cancelled", "The room has been released.");
        } else {
          UI.toast("warn", "Cannot cancel", "Only confirmed bookings can be cancelled.");
        }
        UI.closeModal();
        render();
        break;
      }

      case "resync-lock": {
        Store.resyncLock(id);
        var rr = Store.roomById(id);
        UI.closeModal();
        UI.toast("ok", "Lock re-synced", "Clock on " + rr.lockId + " matches the server again.");
        render();
        break;
      }

      case "reset-demo": doReset(); break;
      default: break;
    }
  }

  /* Filters: selects and search boxes both write into Views.filters.
     Search re-renders on a short debounce so typing stays smooth. */
  var searchTimer = null;
  function onFilterChange(ev) {
    if (!ev.target || typeof ev.target.closest !== "function") return;
    var el = ev.target.closest("[data-filter]");
    if (!el) return;
    var key = el.getAttribute("data-filter");
    Views.filters[key] = el.value;

    if (el.type === "search" || el.type === "text") {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        render();
        /* Put the cursor back where it was — re-rendering replaces the node. */
        var again = document.querySelector('[data-filter="' + key + '"]');
        if (again) {
          again.focus();
          var v = again.value;
          again.value = "";
          again.value = v;
        }
      }, 260);
    } else {
      render();
    }
  }

  function onKeydown(ev) {
    if (ev.key === "Escape") {
      var root = document.getElementById("modalRoot");
      if (root && root.classList.contains("open")) { UI.closeModal(); return; }
      if (window.innerWidth <= 900) toggleSidebar(false);
    }
  }

  /* ------------------------------------------------------------ theme */

  /* With no explicit choice stamped, the page is following the OS preference,
     so read that rather than the (absent) attribute — otherwise the first
     click appears to do nothing for a viewer whose system is already dark. */
  function effectiveTheme() {
    var stamped = document.documentElement.getAttribute("data-theme");
    if (stamped) return stamped;
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)
      ? "dark" : "light";
  }

  function toggleTheme() {
    var next = effectiveTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("pms-theme", next); } catch (e) {}
  }

  /* ------------------------------------------------------------ init */

  function init() {
    contentEl = document.getElementById("view");
    titleEl = document.getElementById("pageTitle");
    subEl = document.getElementById("pageSub");

    Store.load();

    var hotel = Store.hotel();
    document.getElementById("hotelName").textContent = hotel.name;
    document.getElementById("hotelCity").textContent = hotel.city;
    document.getElementById("clock").textContent = UI.dateLong(Store.today());

    document.addEventListener("click", onClick);
    document.addEventListener("change", onFilterChange);
    document.addEventListener("input", onFilterChange);
    document.addEventListener("keydown", onKeydown);
    window.addEventListener("hashchange", function () { current = viewFromHash(); render(); });

    document.getElementById("themeBtn").addEventListener("click", toggleTheme);
    document.getElementById("menuBtn").addEventListener("click", function () { toggleSidebar(); });
    var scrim = document.querySelector(".scrim");
    if (scrim) scrim.addEventListener("click", function () { toggleSidebar(false); });

    current = viewFromHash();
    render();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

</script>
</body>
</html>
