<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilimanjaro View PMS</title>
<meta name="description" content="A working hotel property management system demo: reservations, rooms, housekeeping, RFID key cards and a door audit trail. Sample data only.">
<meta name="robots" content="index, follow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234338ca'/><text x='50' y='70' font-size='52' font-family='Arial,sans-serif' font-weight='bold' fill='white' text-anchor='middle'>K</text></svg>">
<script>
  /* Runs before first paint so the app never flashes the wrong theme.
     Only an explicit choice made in this app is stamped; with no saved
     preference the stylesheet decides via prefers-color-scheme, which also
     leaves any theme set by a host page intact. */
  (function () {
    var t = null;
    try { t = localStorage.getItem("pms-theme"); } catch (e) {}
    if (t) document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="scrim" aria-hidden="true"></div>

<div class="app">

  <!-- ------------------------------------------------------- sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">KVH</span>
      <span class="brand-text">
        <b id="hotelName">Kilimanjaro View Hotel</b>
        <span id="hotelCity">Moshi, Tanzania</span>
      </span>
    </div>

    <nav class="nav">
      <div class="nav-label">Operations</div>
      <a class="nav-item" data-nav="dashboard" href="#/dashboard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 14h7v7H3z"/></svg>
        Dashboard
      </a>
      <a class="nav-item" data-nav="reservations" href="#/reservations">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        Reservations
        <span class="count">0</span>
      </a>
      <a class="nav-item" data-nav="rooms" href="#/rooms">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V6l7-3 7 3v15M10 10h.01M14 10h.01M10 14h.01M14 14h.01"/></svg>
        Rooms
      </a>
      <a class="nav-item" data-nav="guests" href="#/guests">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20"/><circle cx="9" cy="7" r="3.5"/><path d="M22 20v-1.5a4 4 0 0 0-3-3.85M16.5 3.6a4 4 0 0 1 0 6.8"/></svg>
        Guests
      </a>

      <div class="nav-label">Property</div>
      <a class="nav-item" data-nav="housekeeping" href="#/housekeeping">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M8 12h8l1.5 9h-11z"/><path d="M10 16v5M14 16v5"/></svg>
        Housekeeping
        <span class="count">0</span>
      </a>
      <a class="nav-item" data-nav="access" href="#/access">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4"/><path d="m10.5 12.5 8-8 3 3-2 2-2-2-1.5 1.5 2 2-2.5 2.5"/></svg>
        Key cards &amp; access
        <span class="count">0</span>
      </a>

      <div class="nav-label">Analysis</div>
      <a class="nav-item" data-nav="reports" href="#/reports">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l3.5-4 3 3L21 6"/></svg>
        Reports
      </a>
    </nav>

    <div class="sidebar-foot">
      <div class="demo-chip">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"/><path d="M12 9v5M12 17h.01"/></svg>
        <p><b>Demonstration only</b>Fictional property. Every guest, document and card number here is invented.</p>
      </div>
      <button class="btn btn-ghost btn-sm" data-action="reset-demo" style="width:100%">
        <svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
        Reset demo data
      </button>
    </div>
  </aside>

  <!-- ------------------------------------------------------- main -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>

      <div class="page-title">
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSub">Today at a glance</p>
      </div>

      <div class="topbar-right">
        <span class="clock" id="clock">—</span>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <span class="avatar" title="Signed in as the front office">FO</span>
      </div>
    </header>

    <main class="content" id="view">
      <noscript>
        <div class="alert alert-warn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"/><path d="M12 9v5M12 17h.01"/></svg>
          <div><b>JavaScript is required</b><p>This demo runs entirely in the browser, so it needs JavaScript enabled.</p></div>
        </div>
      </noscript>
    </main>
  </div>
</div>

<div class="modal-root" id="modalRoot"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
